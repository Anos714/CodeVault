<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  fill="none"
  role="img"
  aria-label="CodeVault logo"
>
  <defs>
    <linearGradient id="cv-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F151B" />
      <stop offset="1" stop-color="#182230" />
    </linearGradient>
    <linearGradient id="cv-accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2FBF9B" />
      <stop offset="1" stop-color="#5BC0EB" />
    </linearGradient>
    <radialGradient id="cv-glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#2FBF9B" stop-opacity="0.30" />
      <stop offset="1" stop-color="#2FBF9B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cv-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cv-glow)" />
  <rect
    x="2.75"
    y="2.75"
    width="58.5"
    height="58.5"
    rx="15.25"
    stroke="url(#cv-accent)"
    stroke-opacity="0.45"
    stroke-width="1.5"
  />

  <!-- stacked code blocks (vault layers) -->
  <g>
    <!-- bottom layer -->
    <rect
      x="15"
      y="29"
      width="34"
      height="20"
      rx="5"
      fill="#2FBF9B"
      fill-opacity="0.10"
      stroke="#2FBF9B"
      stroke-opacity="0.22"
      stroke-width="1.5"
    />
    <!-- middle layer -->
    <rect
      x="15"
      y="23"
      width="34"
      height="20"
      rx="5"
      fill="#2FBF9B"
      fill-opacity="0.16"
      stroke="#2FBF9B"
      stroke-opacity="0.32"
      stroke-width="1.5"
    />
    <!-- top layer: the code window -->
    <rect
      x="15"
      y="17"
      width="34"
      height="21"
      rx="5"
      fill="#0C1116"
      stroke="url(#cv-accent)"
      stroke-opacity="0.85"
      stroke-width="1.6"
    />
    <!-- window dots -->
    <circle cx="21.5" cy="23.5" r="1.9" fill="#E8B84B" />
    <circle cx="28" cy="23.5" r="1.9" fill="#2FBF9B" />
    <circle cx="34.5" cy="23.5" r="1.9" fill="#6E9BE8" />
    <!-- code lines -->
    <rect x="21" y="29" width="14" height="2.2" rx="1.1" fill="#6E9BE8" fill-opacity="0.85" />
    <rect x="21" y="33.5" width="19" height="2.2" rx="1.1" fill="#8FA6BC" fill-opacity="0.7" />
  </g>
</svg>
