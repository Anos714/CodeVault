<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  fill="none"
  role="img"
  aria-label="CodeVault logo"
>
  <defs>
    <linearGradient id="cv-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fa" />
      <stop offset="1" stop-color="#e2e5ea" />
    </linearGradient>
    <linearGradient id="cv-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171d" />
      <stop offset="1" stop-color="#08080b" />
    </linearGradient>
    <radialGradient id="cv-glow" cx="0.5" cy="0.36" r="0.62">
      <stop offset="0" stop-color="#9eccff" stop-opacity="0.18" />
      <stop offset="1" stop-color="#9eccff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- glass frame -->
  <rect x="10" y="10" width="492" height="492" rx="122" fill="url(#cv-frame)" />
  <rect
    x="12"
    y="12"
    width="488"
    height="488"
    rx="120"
    stroke="#ffffff"
    stroke-opacity="0.9"
    stroke-width="4"
  />

  <!-- ink tile -->
  <rect x="46" y="46" width="420" height="420" rx="102" fill="url(#cv-tile)" />
  <rect x="46" y="46" width="420" height="420" rx="102" fill="url(#cv-glow)" />
  <rect
    x="49"
    y="49"
    width="414"
    height="414"
    rx="99"
    stroke="#ffffff"
    stroke-opacity="0.1"
    stroke-width="4"
  />

  <!-- code window -->
  <rect
    x="140"
    y="166"
    width="232"
    height="180"
    rx="48"
    stroke="#ffffff"
    stroke-opacity="0.92"
    stroke-width="16"
  />

  <!-- code brackets -->
  <path
    d="M212 214 182 256l30 42"
    stroke="#ffffff"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M300 214 330 256l-30 42"
    stroke="#ffffff"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M276 206 236 306"
    stroke="#9eccff"
    stroke-width="16"
    stroke-linecap="round"
  />
</svg>
